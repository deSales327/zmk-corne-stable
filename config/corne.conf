# Corne v3 + nice!nano v2 configuration

# Keep the existing higher BLE transmit power setting.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Required by the existing mouse/pointing layer in corne.keymap.
CONFIG_ZMK_POINTING=y

# Enable the standard Corne SSD1306 OLED support from the upstream shield.
CONFIG_ZMK_DISPLAY=y

# Enable Corne WS2812 RGB underglow.
CONFIG_ZMK_RGB_UNDERGLOW=y

# Previous LED testing in this repository showed that the Corne LED rail should
# not be coupled to ZMK external-power toggling.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Boot with the LEDs enabled. These are also the explicit factory/default values:
# solid red at full brightness.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
