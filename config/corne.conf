# Corne v3 + nice!nano v2 stable configuration

# Keep the existing higher BLE transmit power setting.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Required by the existing mouse/pointing layer in corne.keymap.
CONFIG_ZMK_POINTING=y

# Enable the standard Corne SSD1306 OLED support from the upstream shield.
CONFIG_ZMK_DISPLAY=y

# RGB underglow intentionally left disabled in the stable profile while the
# LED chain/wiring is being validated separately.
# CONFIG_ZMK_RGB_UNDERGLOW=y
